services:
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  postgres:
    image: postgres:latest
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: groven
      POSTGRES_PASSWORD: groven
      POSTGRES_DB: groven_test
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U groven -d groven_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
