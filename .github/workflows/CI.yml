name: Continuous Integration

on:
  push:
    branches: ['**']

  pull_request:
    branches: [main]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Installing Dependencies...
        run: pnpm install

      - name: Type Checking...
        run: pnpm type-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Installing Dependencies...
        run: pnpm install

      - name: Linting...
        run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Installing Dependencies...
        run: pnpm install

      - name: Formatting...
        run: pnpm format

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Installing Dependencies...
        run: pnpm install

      - name: Building...
        run: pnpm build
