name: Continuous Integration

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm format:check

      - name: Ensure migrations are committed
        run: |
          pnpm db:generate
          git diff --exit-code src/db/migrations

      - run: pnpm db:migrate
      - run: pnpm test:coverage

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
